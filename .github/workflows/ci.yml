name: CI

# 把仓库里已有的五套守卫真正变成门禁。
#
# 设计说明（两条容易踩错的点）：
#   1. 这里刻意**不跑** node tools/sync.js。sync 会把镜像"修好"，反而掩盖了
#      "改了源文件忘了同步"的漂移。镜像一致性交给 check-sync 的 A 检查做
#      逐字节比对，这是比 sync + git diff 更直接的判据。
#   2. 全流程零依赖，**不执行 npm install**。仓库的立身之本是单文件 + 零依赖，
#      CI 里多一步 install 就等于默认允许引入依赖。下面有一条自检守着这条红线。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: 守卫链 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: 零依赖红线自检
        run: node tools/ci-selfcheck.js

      - name: 计算回归（6600+ 项断言）
        run: node tools/test-calc.js

      - name: 黄金用例快照（16 用例 × 4 面板逐字节比对）
        run: node tools/check-golden.js

      - name: DOM 静态结构
        run: node tools/check-dom.js

      - name: 漂移检查（镜像 / 文档锚定 / 陈旧表述 / 断言数 / 年度口径 / 数据状态表 / 限期费率 / warn 清单）
        run: node tools/check-sync.js

      - name: 导出 PDF 降级链
        run: node tools/test-export.js
